<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Effort Rating Task</title>

    <!-- jsPsych core -->
    <script src="jspsych/jspsych.js"></script>
    <link  href="jspsych/jspsych.css" rel="stylesheet" type="text/css" />

    <!-- jsPsych plugins -->
    <script src="jspsych/plugin-html-button-response.js"></script>
    <script src="jspsych/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/plugin-call-function.js"></script>

    <!-- Pavlovia integration -->
    <script src="lib/jspsych-7-pavlovia-2022.1.1.js"></script>

    <style>
      html, body {
        height: 100%;
        margin: 0;
        overflow-x: hidden;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        background-color: #1a1a1a;
        color: #ffffff;
      }
      #jspsych-display {
        width: 100%;
        max-width: 100vw;
      }
      .jspsych-display-element {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
      }
      .jspsych-content {
        max-width: 960px;
      }
      .jspsych-html-button-response-button button,
      .jspsych-btn {
        padding: 12px 36px;
        font-size: 1em;
        cursor: pointer;
        border-radius: 0;
      }
      input[type="text"],
      input[type="text"]:focus,
      button {
        border-radius: 0 !important;
        -webkit-appearance: none;
      }

      /* Range slider styling */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        box-sizing: border-box;
        display: block;
        margin: 0;
        height: 8px;
        border-radius: 4px;
        background: #555;
        outline: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--thumb-color, #4488ff);
        cursor: pointer;
        border: 2px solid #fff;
        position: relative;
        z-index: 4;
      }
      input[type="range"]::-moz-range-thumb {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--thumb-color, #4488ff);
        cursor: pointer;
        border: 2px solid #fff;
        position: relative;
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <div id="jspsych-display"></div>
    <script src="main.js?v=3"></script>
  </body>
</html>
